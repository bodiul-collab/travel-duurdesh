<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#071B49" />
  <circle cx="32" cy="32" r="24" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.4" />
  <circle cx="32" cy="32" r="18" fill="url(#bg-grad)" />
  <defs>
    <linearGradient id="bg-grad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0969E8" />
      <stop offset="1" stop-color="#043282" />
    </linearGradient>
    <linearGradient id="needle-north" x1="32" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB800" />
      <stop offset="1" stop-color="#FF8A2A" />
    </linearGradient>
    <linearGradient id="needle-south" x1="32" y1="32" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#93C5FD" />
    </linearGradient>
  </defs>
  <!-- North needle -->
  <polygon points="32,14 36,32 32,30 28,32" fill="url(#needle-north)" />
  <!-- South needle -->
  <polygon points="32,50 36,32 32,34 28,32" fill="url(#needle-south)" opacity="0.85" />
  <!-- Center hub -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="1.5" fill="#071B49" />
</svg>
