      // 1. Critical fetch setter & getter protection for sandboxed iframes & external scripts
      // Prevents "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"

        try {
          if (typeof window !== 'undefined' && 'fetch' in window) {
            var nativeFetch = window.fetch;
            var activeFetch = typeof nativeFetch === 'function' ? nativeFetch.bind(window) : nativeFetch;

            var getFetch = function() {
              return activeFetch;
            };
            var setFetch = function(newFetch) {
              if (typeof newFetch === 'function') {
                activeFetch = newFetch;
              }
            };

            // Explicitly define on Window.prototype (where fetch getter resides in modern browsers)
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: getFetch,
                  set: setFetch,
                  configurable: true,

                });
              } catch (eProto) {}
            }

            // Walk prototype chain of window and ensure every prototype level has the setter
            var target = window;
            while (target) {
              try {
                var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
                if (desc || target === window) {
                  Object.defineProperty(target, 'fetch', {
                    get: getFetch,
                    set: setFetch,
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (eDesc) {}
              target = Object.getPrototypeOf(target);
            }
          }
        } catch (globalErr) {}

        // Global defensive error handling to prevent third-party scripts/widgets from breaking runtime
        try {
          window.addEventListener('error', function(event) {
            var msg = event && event.message ? String(event.message) : '';
            if (
              !msg ||
              msg === 'Script error.' ||
              msg.indexOf('fetch') !== -1 ||
              (event.filename && (event.filename.indexOf('tpwdg.com') !== -1 || event.filename.indexOf('translate.google') !== -1))
            ) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = (reason && reason.message) ? String(reason.message) : (typeof reason === 'string' ? reason : '');
            if (!msg || msg.indexOf('fetch') !== -1) {
              event.preventDefault();
            }
          });

          var prevOnError = window.onerror;
          window.onerror = function(message, source, lineno, colno, error) {
            var msg = message ? String(message) : '';
            if (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {

            }

              return prevOnError.apply(this, arguments);
            }

          };
